version: 1
applications:
  - appRoot: apps/dashboard
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - corepack enable
            - pnpm install --config.node-linker=hoisted --config.shamefully-hoist=true --config.dangerouslyAllowAllBuilds=true
        build:
          commands:
            - pnpm run build:dashboard
            - |
              set -e
              STANDALONE=apps/dashboard/.next/standalone
              APP_STANDALONE="$STANDALONE/apps/dashboard"
              DEST_NM=apps/dashboard/node_modules
              test -d "$STANDALONE"
              test -f "$APP_STANDALONE/server.js"
              mkdir -p "$APP_STANDALONE/.next"
              cp -a apps/dashboard/.next/static "$APP_STANDALONE/.next/"
              if [ -d apps/dashboard/public ]; then
                cp -a apps/dashboard/public "$APP_STANDALONE/"
              fi
              has_swc_subpath() {
                dir="$1"
                [ -e "$dir/_/_interop_require_default.js" ] || [ -e "$dir/esm/_interop_require_default.js" ]
              }
              NEXT_SRC=""
              next_json=$(find "$STANDALONE/node_modules" -path "*/node_modules/next/package.json" 2>/dev/null | head -n 1)
              if [ -n "$next_json" ]; then
                NEXT_SRC=$(readlink -f "$(dirname "$next_json")")
              fi
              if [ -z "$NEXT_SRC" ] || [ ! -f "$NEXT_SRC/package.json" ]; then
                echo "ERROR: could not find traced next in standalone" >&2
                exit 1
              fi
              SWC_SRC=""
              while IFS= read -r pkg_json; do
                [ -n "$pkg_json" ] || continue
                dir=$(readlink -f "$(dirname "$pkg_json")")
                if [ -f "$dir/package.json" ] && has_swc_subpath "$dir"; then
                  SWC_SRC="$dir"
                  break
                fi
              done <<EOF
              $(find "$STANDALONE/node_modules" -path "*/@swc/helpers/package.json" 2>/dev/null)
              EOF
              if [ -z "$SWC_SRC" ]; then
                echo "ERROR: could not find @swc/helpers with _interop_require_default" >&2
                exit 1
              fi
              echo "NEXT_SRC=$NEXT_SRC"
              echo "SWC_SRC=$SWC_SRC"
              materialize_swc_underscore() {
                dir="$1"
                if [ -e "$dir/_/_interop_require_default.js" ]; then
                  return 0
                fi
                mkdir -p "$dir/_"
                if [ -f "$dir/esm/_interop_require_default.js" ]; then
                  cp -a "$dir/esm/_interop_require_default.js" "$dir/_/_interop_require_default.js"
                elif [ -f "$dir/cjs/_interop_require_default.cjs" ]; then
                  cp -a "$dir/cjs/_interop_require_default.cjs" "$dir/_/_interop_require_default.js"
                else
                  echo "ERROR: cannot materialize _/_interop_require_default.js in $dir" >&2
                  return 1
                fi
              }
              copy_real_dir() {
                src="$1"
                dest="$2"
                real=$(readlink -f "$src")
                test -d "$real"
                tmp="${dest}.copy-tmp"
                rm -rf "$tmp" "$dest"
                mkdir -p "$(dirname "$dest")"
                cp -a --dereference "$real" "$tmp"
                if [ -L "$tmp" ]; then
                  echo "ERROR: copy of $src is still a symlink at $tmp" >&2
                  exit 1
                fi
                mv "$tmp" "$dest"
                test ! -L "$dest"
                test -d "$dest"
              }
              copy_next() {
                dest="$1"
                copy_real_dir "$NEXT_SRC" "$dest"
                test -f "$dest/package.json"
                test -d "$dest/dist"
              }
              copy_swc_helpers() {
                dest="$1"
                copy_real_dir "$SWC_SRC" "$dest"
                materialize_swc_underscore "$dest"
                test -e "$dest/_/_interop_require_default.js"
                test ! -L "$dest"
              }
              install_next_and_helpers() {
                root="$1"
                copy_next "$root/next"
                copy_swc_helpers "$root/@swc/helpers"
                copy_swc_helpers "$root/next/node_modules/@swc/helpers"
              }
              install_next_and_helpers "$STANDALONE/node_modules"
              install_next_and_helpers "$APP_STANDALONE/node_modules"
              rm -rf "$DEST_NM"
              install_next_and_helpers "$DEST_NM"
              test -f apps/dashboard/.next/required-server-files.json
              cp -a apps/dashboard/.next/required-server-files.json "$STANDALONE/required-server-files.json"
              cp -a apps/dashboard/.next/required-server-files.json "$APP_STANDALONE/required-server-files.json"
              if [ -f apps/dashboard/.next/BUILD_ID ]; then
                cp -a apps/dashboard/.next/BUILD_ID "$STANDALONE/BUILD_ID"
                cp -a apps/dashboard/.next/BUILD_ID "$APP_STANDALONE/BUILD_ID"
              fi
              mkdir -p "$APP_STANDALONE/.next/server" "$STANDALONE"
              if [ -d apps/dashboard/.next/server ]; then
                cp -a apps/dashboard/.next/server/. "$APP_STANDALONE/.next/server/"
              fi
              for f in apps/dashboard/.next/*.nft.json; do
                [ -f "$f" ] || continue
                cp -a "$f" "$STANDALONE/"
                mkdir -p "$APP_STANDALONE/.next"
                cp -a "$f" "$APP_STANDALONE/.next/"
              done
              while IFS= read -r nft; do
                [ -n "$nft" ] || continue
                rel=${nft#apps/dashboard/.next/}
                mkdir -p "$STANDALONE/$(dirname "$rel")" "$APP_STANDALONE/.next/$(dirname "$rel")"
                cp -a "$nft" "$STANDALONE/$rel"
                cp -a "$nft" "$APP_STANDALONE/.next/$rel"
              done <<EOF
              $(find apps/dashboard/.next -name '*.nft.json' ! -path '*/cache/*' 2>/dev/null)
              EOF
              rm -rf apps/dashboard/.next/node_modules apps/dashboard/.next/cache
              install_next_and_helpers "$STANDALONE/node_modules"
              install_next_and_helpers "$APP_STANDALONE/node_modules"
              install_next_and_helpers "$DEST_NM"
              test ! -L "$STANDALONE/node_modules/next"
              test ! -L "$STANDALONE/node_modules/@swc/helpers"
              test -f "$STANDALONE/node_modules/next/package.json"
              test -d "$STANDALONE/node_modules/next/dist"
              ls "$STANDALONE/node_modules" | grep -w next
              echo NEXT_AT_ARTIFACT_ROOT_OK
              test -e "$STANDALONE/node_modules/next/node_modules/@swc/helpers/_/_interop_require_default.js"
              test -e "$STANDALONE/node_modules/@swc/helpers/_/_interop_require_default.js"
              echo SWC_SUBPATH_OK
              test -f "$STANDALONE/required-server-files.json"
              echo REQUIRED_SERVER_FILES_OK
              nft_count=$(find "$STANDALONE" -name '*.nft.json' | wc -l)
              test "$nft_count" -ge 1
              echo SERVER_TRACES_OK
              echo SLIM_STANDALONE_OK
              du -sh "$STANDALONE" "$DEST_NM" "$DEST_NM/next" "$STANDALONE/node_modules/next" "$STANDALONE/node_modules/@swc/helpers"
      artifacts:
        baseDirectory: apps/dashboard/.next/standalone
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - apps/dashboard/.next/cache/**/*
